<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>QyrexObf v4</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:#07070c;color:#e4e4ed;font-family:system-ui,sans-serif;margin:0;min-height:100vh}
  body::before{content:"";position:fixed;width:420px;height:420px;top:-120px;left:-80px;background:rgba(124,58,237,.25);filter:blur(90px);border-radius:50%;pointer-events:none}
  .card{background:rgba(17,17,24,.9);border:1px solid #1c1c28;border-radius:16px;position:relative}
  textarea{width:100%;min-height:210px;background:#0c0c12;border:1px solid #252533;border-radius:12px;color:#e4e4ed;padding:14px;font-family:ui-monospace,monospace;font-size:12.5px;resize:vertical}
  .btn{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;border:none;border-radius:10px;padding:12px 20px;font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.5}
</style>
</head>
<body class="p-6">
<div class="max-w-3xl mx-auto relative">
  <h1 class="text-2xl font-bold mb-1">QyrexObf <span class="text-purple-400">v4</span></h1>
  <p class="text-sm mb-6" style="color:#6b6b80">Lexer real · strings · rename · numbers · anti-tamper · control-flow</p>
  <div class="card p-5 mb-4">
    <textarea id="src" placeholder="pega tu script Lua / Luau..."></textarea>
    <div class="flex flex-wrap gap-3 mt-3 items-center">
      <label class="text-sm" style="color:#8b8b9e"><input type="checkbox" id="anti" checked/> Anti-tamper</label>
      <label class="text-sm" style="color:#8b8b9e"><input type="checkbox" id="str" checked/> Strings</label>
      <label class="text-sm" style="color:#8b8b9e"><input type="checkbox" id="ren" checked/> Rename locals</label>
      <label class="text-sm" style="color:#8b8b9e"><input type="checkbox" id="num" checked/> numbers</label>
      <button class="btn" id="go" onclick="run()">Ofuscar</button>
      <button class="btn" style="background:#1a1a24;border:1px solid #2a2a3a" onclick="navigator.clipboard.writeText(out.value)">Copiar</button>
    </div>
    <p id="err" class="text-red-400 text-sm mt-2 hidden"></p>
    <p id="meta" class="text-xs mt-2" style="color:#5a5a6e"></p>
  </div>
  <div class="card p-5">
    <textarea id="out" readonly placeholder="-- Protect by QyrexObf v4"></textarea>
  </div>
</div>
<script>
async function run(){
  const err=document.getElementById('err'); err.classList.add('hidden');
  go.disabled=true; go.textContent='Ofuscando...';
  try{
    const r=await fetch('/api/obfuscate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      code: src.value,
      options:{
        antiTamper: anti.checked,
        strings: str.checked,
        renameLocals: ren.checked,
        numbers: num.checked,
        controlFlow: true,
        junk: true
      }
    })});
    const d=await r.json();
    if(!r.ok||!d.success) throw new Error(d.error||'Error');
    out.value=d.code;
    const s=d.stats||{};
    meta.textContent=`${s.inputBytes||0} → ${s.outputBytes||0} bytes · strings ${s.stringsEncrypted||0} · locals ${s.localsRenamed||0} · nums ${s.numbersMutated||0}`;
  }catch(e){err.textContent=e.message;err.classList.remove('hidden');}
  finally{go.disabled=false;go.textContent='Ofuscar';}
}
</script>
</body>
</html>
